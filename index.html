<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie to watch</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="https://kit.fontawesome.com/73b6f5a7c2.js" crossorigin="anonymous"></script>
    <script src="./script.js"></script>
</head>
<body>
    
   <main id="wrapper">
    
    <div class="userdata">
    <i class="fa-solid fa-user-secret"></i> <h1>Hello Mate!👋🏽</h1>
     </div>
    <header id="page-banner">
        <h1>Movies to watch</h1>
    </header>

    <section id="movie-list">
        <ul>
            <li>
            <span class="name">The Intern</span>
            <span class="edit">Edit</span>
            <span class="actions">
            <span class="delete">Delete</span>
            </span>
            </li>
            <li>
            <span class="name">Captain America</span>
            <span class="edit">Edit</span>
            <span class="actions">
            <span class="delete">Delete</span>
            </span>
            </li>
            <li>
            <span class="name">The Paper</span>
            <span class="edit">Edit</span>
            <span class="actions">
            <span class="delete">Delete</span>
            </span>
            </li>
            <li>
            <span class="name">Nobody 2</span>
            <span class="edit">Edit</span>
            <span class="actions">
            <span class="delete">Delete</span>
            </span>
            </li>
        </ul>
    </section>

    <form id ="add-movie">
        <input type="text" placeholder="Add movie title..." >
        <button type="submit" class="add-movie-button">Add</button>
    </form>
     <div id="overlay"></div>
     <form id="edit-movies" style="display: none;">
                <label for="edit-movie-input">Edit movie title</label>
                <input type="text" id="edit-movie-input">
                <button type="submit">Update movie</button>
            </form>
   </main>
   <div id="toast" class="toast"></div>
</body>
</html>
